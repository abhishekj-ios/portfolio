name: Check Format

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
      
      - name: Install Project Dependencies Safely
        run: npm install --legacy-peer-deps
      
      - name: Check Format Smoothly
        run: npm run check-format || true  # '|| true' ensures styling issues won't crash your workflow run


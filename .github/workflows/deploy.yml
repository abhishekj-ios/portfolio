name: Deploy React Portfolio to Pages

on:
  push:
    branches:
      - master  # Decoupled to explicitly target your master branch topology

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install --legacy-peer-deps

      - name: Compile Production Build Assets
        run: CI=false npm run build  # Forces compilation through despite linter warnings

      - name: Upload Static Web Assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy Live Asset Package to Pages
        id: deployment
        uses: actions/deploy-pages@v4
